<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Životopis. Taras Chornyi</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1b1b1b;
      --text: #cfcfcf;
      --muted: #8a8a8a;
      --red: #b00020;
      --red-bright: #e0102f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0 auto;
      max-width: 640px;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace;
      line-height: 1.7;
    }

    h1 {
      margin: 0 0 24px;
      padding-bottom: 12px;
      font-size: 2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      border-bottom: 3px solid var(--red);
    }

    h2 {
      margin: 40px 0 12px;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--red-bright);
    }

    h2::before {
      content: "// ";
      color: var(--muted);
    }

    img[width="200"] {
      display: block;
      border: 2px solid var(--red);
      border-radius: 4px;
      filter: grayscale(100%) contrast(1.05);
      transition: filter 0.3s, box-shadow 0.3s;
    }

    a:hover img[width="200"] {
      filter: grayscale(0%);
      box-shadow: 0 0 18px rgba(176, 0, 32, 0.6);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      padding: 8px 12px;
      margin-bottom: 6px;
      background: var(--panel);
      border-left: 3px solid var(--red);
    }

    h2 + ul li::before {
      content: "> ";
      color: var(--red-bright);
    }

    p {
      color: var(--muted);
      margin: 0 0 12px;
    }

    /* contact list with icons */
    li img {
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-right: 10px;
      filter: invert(1) opacity(0.85); /* black icons -> light */
    }

    a {
      color: var(--red-bright);
      text-decoration: none;
      border-bottom: 1px dashed var(--red);
      transition: color 0.2s, border-color 0.2s;
    }

    a:hover {
      color: #fff;
      border-bottom-color: #fff;
    }

    ::selection {
      background: var(--red);
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>Taras Chornyi</h1>

  <a href="https://www.instagram.com/akonitx/">
    <img src="https://akonitx.github.io/TUKE2/6DB409F7-7E14-474B-B6BC-6CD956D75572_1_201_a.jpeg" alt="Fotografia – Taras Chornyi" width="200">
  </a>

  <h2>Čo ma baví</h2>
  <ul>
    <li>plávanie</li>
    <li>volejbal</li>
    <li>Kartové hry (durak)</li>
  </ul>

  <h2>Kontakt a sociálne siete</h2>
  <p>Som tu.</p>
  <ul>
    <li>
      <img src="https://cdn.simpleicons.org/github" alt="GitHub">
      <a href="https://github.com/akonitx">akonitx</a>
    </li>
    <li>
      <img src="https://cdn.simpleicons.org/instagram" alt="Instagram">
      <a href="https://www.instagram.com/akonitx/">akonitx</a>
    </li>
  </ul>

</body>
</html>
