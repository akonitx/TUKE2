<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Životopis. Taras Chornyi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #181818;
      --text: #d6d6d6;
      --muted: #8a8a8a;
      --red: #a8001c;
      --red-bright: #e0102f;
      --font: "IBM Plex Mono", "Roboto Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; border-radius: 0; }

    body {
      margin: 0 auto;
      max-width: 640px;
      padding: 48px 24px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 500;
      line-height: 1.7;
    }

    h1 {
      margin: 0 0 24px;
      padding-bottom: 12px;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      border-bottom: 4px solid var(--red);
    }

    h2 {
      margin: 40px 0 12px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red-bright);
    }

    h2::before {
      content: "// ";
      color: var(--muted);
    }

    img[width="200"] {
      display: block;
      border: 3px solid var(--red);
      filter: grayscale(100%) contrast(1.1);
      transition: filter 0.3s, box-shadow 0.3s;
    }

    a:hover img[width="200"] {
      filter: grayscale(0%);
      box-shadow: 0 0 18px rgba(168, 0, 28, 0.6);
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      padding: 8px 14px;
      margin-bottom: 6px;
      background: var(--panel);
      border-left: 4px solid var(--red);
      font-weight: 700;
    }

    p + ul
